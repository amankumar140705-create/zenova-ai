<script>

let userName = "";
let zenovaMessages = [];

function showHome() {
    document.getElementById("content").innerHTML = `
        <h2>Welcome Home!</h2>
        <p>ZENOVA AI is ready to assist you.</p>
        <p>Choose a feature from the sidebar.</p>
    `;
}

function showChat() {
    document.getElementById("content").innerHTML = `
        <h2>💬 ZENOVA AI Chat</h2>

        <div id="chat">
            <p><b>ZENOVA:</b> Hello! How can I help you?</p>
        </div>

        <input
            id="message"
            placeholder="Type your message..."
            onkeydown="if(event.key==='Enter') sendMessage()"
        >

        <button class="send" onclick="sendMessage()">Send</button>
    `;
}

async function sendMessage() {
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const message = input.value.trim();
    if (!message) return;

    const userMessage = document.createElement("p");
    userMessage.textContent = "You: " + message;
    chat.appendChild(userMessage);

    input.value = "";

    zenovaMessages.push({
        role: "user",
        content: message
    });

    const loading = document.createElement("p");
    loading.textContent = "ZENOVA is thinking...";
    chat.appendChild(loading);

    try {
        const response = await fetch(
            "https://zenova-ai-zeta.vercel.app/api/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    messages: zenovaMessages
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "AI connection failed");
        }

        const reply = data.reply;

        zenovaMessages.push({
            role: "assistant",
            content: reply
        });

        loading.textContent = "ZENOVA: " + reply;

    } catch (error) {
        console.error(error);
        loading.textContent =
            "ZENOVA: Connection error. Please try again.";

        zenovaMessages.pop();
    }

    chat.scrollTop = chat.scrollHeight;
}

function showScience() {
    document.getElementById("content").innerHTML = `
        <h2>📚 Science Assistant</h2>
        <p>Welcome to your Science Learning Centre!</p>
        <p>⚡ Physics</p>
        <p>🧪 Chemistry</p>
        <p>🧬 Biology</p>
        <p>More science features coming soon.</p>
    `;
}

function showCalculator() {
    document.getElementById("content").innerHTML = `
        <h2>🔢 Calculator</h2>
        <input type="number" id="num1" placeholder="First number">
        <input type="number" id="num2" placeholder="Second number">
        <br>
        <button class="send" onclick="calculate()">Add</button>
        <p id="result"></p>
    `;
}

function calculate() {
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);

    document.getElementById("result").innerText =
        "Result: " + (a + b);
}

function showSettings() {
    document.getElementById("content").innerHTML = `
        <h2>⚙️ Settings</h2>
        <p>App Name: ZENOVA AI</p>
        <p>Version: 1.0</p>
        <p>Personality: Friendly</p>
        <p>Creator: You!</p>
    `;
}

</script>
